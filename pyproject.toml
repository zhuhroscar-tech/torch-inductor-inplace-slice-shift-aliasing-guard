[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-inductor-inplace-slice-shift-aliasing-guard"
version = "0.1.0"
description = "Guards a real torch.compile (Inductor) correctness bug: an in-place slice-shift assignment like x[1:] = x[:-1].clone() compiles to a copy over overlapping memory, silently corrupting rows on CPU (wrong at any size, every run) and non-deterministically on CUDA at larger shapes (pytorch/pytorch#197829), because the reinplacing pass turns a functionalized generalized_scatter into view(x).copy_(src) without checking that src is itself a view of x's own storage"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "zhuhroscar-tech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
torch = ["torch>=2.0"]

[project.scripts]
torch-inductor-inplace-slice-shift-aliasing-guard = "torch_inductor_inplace_slice_shift_aliasing_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
